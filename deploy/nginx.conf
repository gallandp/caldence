# Example nginx server block serving Caldence at /apps/caldence/.
# The files of the release ZIP live in <root>/apps/caldence/ (root is /usr/share/nginx/html here).
# Also used by the deploy smoke test in CI.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Keep the host and port when redirecting /apps/caldence to /apps/caldence/.
  absolute_redirect off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
  }

  location ~ /\.ht {
    deny all;
  }

  location ~ ^/apps/caldence/(web\.config|README\.txt|\.caldence-deploy-files)$ {
    deny all;
  }

  # add_header in a location replaces the server's, so every location below repeats the
  # security headers (#42).
  location /apps/caldence/ {
    index index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
  }

  # Hashed files never change.
  location /apps/caldence/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
  }

  location ~ ^/apps/caldence/workbox-[^/]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
  }
}
