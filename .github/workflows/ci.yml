name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the release workflow for its release PR (see release.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's image already holds the browsers and their system libraries, which
    # `playwright install --with-deps` took 1 to 9 minutes to fetch. Keep the tag in step with
    # @playwright/test in package.json; the install step below covers a mismatch.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      # Firefox refuses to start as root with a HOME it does not own.
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No dependency needs an install script.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Does nothing when the image matches @playwright/test; otherwise fetches the browsers.
      - run: npx playwright install chromium firefox webkit
      - run: npm run e2e
      - run: npm run screenshots -- --out "$RUNNER_TEMP/shots"
      # All packages are devDependencies (the bundle is built from them), so --omit=dev would
      # check nothing. Fails on high and critical advisories; lower ones go through Dependabot.
      - run: npm audit --audit-level=high

  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No dependency needs an install script.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package
      - name: Unzip into the served folder
        run: |
          mkdir -p srv/apps/caldence
          unzip -q caldence-*.zip -d srv/apps/caldence
      - name: Start Apache and nginx
        run: |
          docker run -d --name apache -p 8081:80 \
            -v "$PWD/srv:/usr/local/apache2/htdocs:ro" \
            -v "$PWD/deploy/apache-test.conf:/usr/local/apache2/conf/httpd.conf:ro" \
            httpd:2.4
          docker run -d --name nginx -p 8082:80 \
            -v "$PWD/srv:/usr/share/nginx/html:ro" \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine
          for port in 8081 8082; do
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null "http://localhost:$port/apps/caldence/" && break
              if [ "$i" = 30 ]; then
                docker logs apache; docker logs nginx
                echo "Port $port did not answer" >&2
                exit 1
              fi
              sleep 1
            done
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.deploy.config.ts
        env:
          DEPLOY_URLS: http://localhost:8081/apps/caldence/,http://localhost:8082/apps/caldence/
      - name: Server logs
        if: failure()
        run: |
          docker logs apache
          docker logs nginx
