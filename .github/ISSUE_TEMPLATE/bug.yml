name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Caldence version
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
